name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build universal app and installers
        run: ./build.sh

      - name: Verify binaries and signature
        run: |
          file "dist/CDR QuickLook.app/Contents/MacOS/CDRQuickLook"
          codesign --verify --deep --strict --verbose=2 "dist/CDR QuickLook.app"

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: CDR-QuickLook-${{ github.sha }}
          path: |
            dist/*.dmg
            dist/*.zip
